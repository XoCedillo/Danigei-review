version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: always
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    restart: always
    ports:
      - "8080:80"
    env_file: .env
    volumes:
      - wp-data:/var/www/html

volumes:
  db_data:
  wp-data: